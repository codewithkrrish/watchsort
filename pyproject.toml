[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchsort"
version = "0.1.0"
description = "Watch a folder and sort new files into dated, type-based subfolders — with undo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krrish", email = "codewithkrrish7@gmail.com" }]
keywords = ["files", "organizer", "downloads", "cli", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
watchsort = "watchsort.cli:main"

[project.urls]
Homepage = "https://github.com/codewithkrrish/watchsort"

[tool.setuptools]
packages = ["watchsort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
